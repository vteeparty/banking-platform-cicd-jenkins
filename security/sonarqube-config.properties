# ============================================================
# Banking Platform — SonarQube Scanner Configuration
# File: security/sonarqube-config.properties
# Referenced by: pipelines/Jenkinsfile (SonarQube stage)
# ============================================================
#
# ── STEP 1: Start SonarQube with Docker ──────────────────────
#
#   Run this command ONCE in your terminal to start SonarQube locally:
#
#     docker run -d \
#       --name sonarqube \
#       -p 9000:9000 \
#       sonarqube:community
#
#   Explanation of flags:
#     -d            → Run the container in the background (detached mode)
#     --name        → Give the container a friendly name so you can stop/start it easily
#     -p 9000:9000  → Map port 9000 on your machine to port 9000 inside the container
#     sonarqube:community → Use the free Community Edition image from Docker Hub
#
#   After ~60 seconds, open http://localhost:9000 in your browser.
#   Default login: admin / admin  (SonarQube will ask you to set a new password)
#
#   Useful Docker commands after first run:
#     docker stop  sonarqube    ← stop the server
#     docker start sonarqube    ← start it again (data is preserved)
#     docker logs  sonarqube    ← view server logs if something goes wrong
#
# ── STEP 2: Configure Jenkins ────────────────────────────────
#
#   1. Install the "SonarQube Scanner" plugin:
#        Manage Jenkins → Plugins → Available → search "SonarQube Scanner" → Install
#
#   2. Register the server:
#        Manage Jenkins → System → SonarQube Servers → Add
#          Name : SonarQube-Local
#          URL  : http://localhost:9000
#          (leave Authentication Token blank for local no-auth setup)
#
#   3. Register the scanner tool:
#        Manage Jenkins → Tools → SonarQube Scanner → Add
#          Name             : SonarScanner
#          Install automatically: ✔
#
# ── STEP 3: Run the Maven Sonar command ──────────────────────
#
#   The Jenkins pipeline stage runs this command automatically,
#   but you can also execute it manually from your project root:
#
#     mvn sonar:sonar \
#       -Dsonar.projectKey=banking-platform \
#       -Dsonar.host.url=http://localhost:9000
#
#   After it finishes, open http://localhost:9000 → Projects
#   to see the full analysis report (bugs, code smells, coverage).
#
# ── STEP 4: Add sonar-maven-plugin to pom.xml ────────────────
#
#   Make sure the following plugin is present in your pom.xml <build> section.
#   If you already have spring-boot-starter-parent, the version is managed for you.
#
#     <plugin>
#       <groupId>org.sonarsource.scanner.maven</groupId>
#       <artifactId>sonar-maven-plugin</artifactId>
#       <version>3.10.0.2594</version>  <!-- use latest stable -->
#     </plugin>
#
# ============================================================

# ── Project Identity ─────────────────────────────────────────
sonar.projectKey=banking-platform
sonar.projectName=Banking Platform CI/CD
sonar.projectVersion=1.0

# ── Source & Binary Paths ────────────────────────────────────
# Adjust these paths to match your build tool output
sonar.sources=src/main
sonar.tests=src/test
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes

# ── Language ─────────────────────────────────────────────────
sonar.language=java
sonar.sourceEncoding=UTF-8

# ── Test Coverage ────────────────────────────────────────────
# JaCoCo XML report (produced by: mvn test jacoco:report)
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# ── Exclusions ───────────────────────────────────────────────
# Exclude generated code, migrations, and configuration classes from analysis
sonar.exclusions=\
  **/generated/**,\
  **/target/**,\
  **/build/**,\
  **/*Config.java,\
  **/*Configuration.java,\
  **/db/migration/**

sonar.coverage.exclusions=\
  **/*Application.java,\
  **/*Config.java,\
  **/*Configuration.java,\
  **/model/**,\
  **/entity/**,\
  **/dto/**

# ── Quality Gate ─────────────────────────────────────────────
# The pipeline will block on the "Sonar way" gate by default.
# Override by setting a custom gate in the SonarQube server UI.

# ── SonarQube Server (local Docker) ──────────────────────────
# The server URL is injected at runtime by Jenkins via withSonarQubeEnv().
# For manual mvn runs, pass: -Dsonar.host.url=http://localhost:9000
sonar.host.url=http://localhost:9000
# → SonarQube servers (name: SonarQube-Local)
# Do NOT hard-code the token here; use the Jenkins credential binding.

# ── Banking-Specific Rules ───────────────────────────────────
# These custom rule profiles must be created in the SonarQube server UI.
# Recommended: activate OWASP Top 10 and CWE Top 25 security profiles.
# sonar.profile=Banking-Security-Profile
