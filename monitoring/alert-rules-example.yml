# ============================================================
# Example Alert Rules — Prometheus
# ============================================================
#
# This file defines alerts that Prometheus will evaluate.
# To enable, uncomment 'rule_files' in prometheus.yml
#
# Alerts are evaluated every evaluation_interval (default 15s).
# When an alert condition is true for the duration, it fires.
#
# File location: monitoring/alert-rules-example.yml
#
# To use:
#  1. Rename to alert-rules.yml
#  2. Uncomment in prometheus.yml:
#     rule_files:
#       - /etc/prometheus/alert-rules.yml
#  3. Mount in docker-compose.yml:
#     volumes:
#       - ./alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
#  4. Restart: docker-compose restart prometheus
#
# ============================================================

groups:
  - name: banking_platform_alerts
    interval: 30s

    rules:
      # ── Alert 1: Service is DOWN ────────────────────────────────
      # Fires when a service hasn't responded to Prometheus scrape
      # for 2 consecutive scrape intervals (60 seconds).
      - alert: ServiceDown
        expr: up{job=~"payment-service|transaction-service|notification-service"} == 0
        for: 2m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "{{ $labels.job }} is DOWN"
          description: "Service {{ $labels.job }} on {{ $labels.instance }} has been unreachable for 2 minutes."

      # ── Alert 2: High Memory Usage ──────────────────────────────
      # Fires when JVM heap memory usage exceeds 80% of maximum.
      - alert: HighMemoryUsage
        expr: (jvm_memory_used_bytes{type="heap"} / jvm_memory_max_bytes{type="heap"}) > 0.8
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "High memory usage on {{ $labels.job }}"
          description: "JVM heap usage is {{ $value | humanizePercentage }} on {{ $labels.job }}."

      # ── Alert 3: High HTTP Error Rate ──────────────────────────
      # Fires when 5xx error rate exceeds 5% over 5 minutes.
      - alert: HighErrorRate
        expr: |
          (sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) by (job))
          /
          (sum(rate(http_server_requests_seconds_count[5m])) by (job))
          > 0.05
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "High error rate on {{ $labels.job }}"
          description: "Error rate is {{ $value | humanizePercentage }} on {{ $labels.job }}."

      # ── Alert 4: High Response Time ────────────────────────────
      # Fires when 95th percentile response time exceeds 500ms.
      - alert: HighResponseTime
        expr: |
          histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket[5m])) by (le, job))
          > 0.5
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Slow requests on {{ $labels.job }}"
          description: "95th percentile response time is {{ $value | humanizeDuration }} on {{ $labels.job }}."

      # ── Alert 5: Garbage Collection Pause Time ─────────────────
      # Fires when GC pause time exceeds 100ms (indicates performance issue).
      - alert: LongGCPauseTime
        expr: |
          increase(jvm_gc_pause_seconds_sum[5m]) > 0.1
        for: 2m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Long GC pause on {{ $labels.job }}"
          description: "GC pause time exceeded 100ms on {{ $labels.job }} in the last 5 minutes."

      # ── Alert 6: Too Many Threads ───────────────────────────────
      # Fires when thread count exceeds 200 (may indicate thread leak).
      - alert: TooManyThreads
        expr: jvm_threads_live > 200
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "High thread count on {{ $labels.job }}"
          description: "{{ $labels.job }} has {{ $value }} threads running."

      # ── Alert 7: Prometheus Scrape Slow ─────────────────────────
      # Fires when a scrape takes longer than 5 seconds (indicates problems).
      - alert: Prometheus_Scrape_Slow
        expr: scrape_duration_seconds > 5
        for: 5m
        labels:
          severity: info
          team: platform
        annotations:
          summary: "Slow Prometheus scrape for {{ $labels.job }}"
          description: "Scraping {{ $labels.job }} took {{ $value | humanizeDuration }}."

# ============================================================
# Integration with AlertManager (Optional)
# ============================================================
#
# To send alerts via email, Slack, or PagerDuty:
#
# 1. Set up AlertManager (separate service):
#    docker run -p 9093:9093 prom/alertmanager:latest
#
# 2. Add to prometheus.yml:
#    alerting:
#      alertmanagers:
#        - static_configs:
#            - targets:
#                - localhost:9093
#
# 3. Configure AlertManager channels:
#    - Email
#    - Slack
#    - PagerDuty
#    - Custom webhook
#
# References:
# - AlertManager Docs: https://prometheus.io/docs/alerting/latest/overview/
# - Routing Rules: https://prometheus.io/docs/alerting/latest/configuration/#routing
# - Slack Integration: https://prometheus.io/docs/alerting/latest/notification_examples/
#
# ============================================================
